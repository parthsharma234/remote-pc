<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Remote PC">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="stylesheet" href="/style.css">
  <title>Remote PC</title>
</head>
<body>
  <svg width="0" height="0" style="position:absolute">
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 4.5L7.5 12l7.5 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-fwd" viewBox="0 0 24 24"><path d="M9 4.5l7.5 7.5L9 19.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5.5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2.2" fill="currentColor"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-compose" viewBox="0 0 24 24"><path d="M12 4.5H7A3 3 0 0 0 4 7.5v9.5a3 3 0 0 0 3 3h9.5a3 3 0 0 0 3-3V12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M17.7 3.7a2 2 0 0 1 2.8 2.8l-8.2 8.2-3.6.8.8-3.6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M12 3.5c5 0 9 3.4 9 7.6s-4 7.6-9 7.6c-1 0-2-.1-2.9-.4L4.3 20.5l1.3-3.7C4 15.3 3 13.3 3 11.1c0-4.2 4-7.6 9-7.6z" fill="currentColor"/></symbol>
    <symbol id="i-reload" viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.05-4.95M19 4v4h-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-tabs" viewBox="0 0 24 24"><rect x="3.5" y="7.5" width="13" height="13" rx="3.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 3.5h9.3a3.2 3.2 0 0 1 3.2 3.2V16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-kbd" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6.5 10h.01M10 10h.01M14 10h.01M17.5 10h.01M8 14h8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-diff" viewBox="0 0 24 24"><path d="M12 3.5v8M8 7.5h8M8 18h8" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.2v13.6c0 .8.9 1.3 1.6.8l10-6.8c.6-.4.6-1.2 0-1.6l-10-6.8C8.9 3.9 8 4.4 8 5.2z" fill="currentColor"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-terminal" viewBox="0 0 24 24"><path d="M5 7l5 5-5 5M12 17h7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M15.5 4.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-doc" viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7z M14 3v5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="currentColor"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15.5 15.5L20 20" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z" fill="currentColor"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-claude" viewBox="0 0 24 24"><path d="M12 2.8l1.2 6.1 4.5-4.3-2.6 5.6 6.1-.6-5.4 3 5.4 3-6.1-.6 2.6 5.6-4.5-4.3-1.2 6.1-1.2-6.1-4.5 4.3 2.6-5.6-6.1.6 5.4-3-5.4-3 6.1.6-2.6-5.6 4.5 4.3z" fill="currentColor"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7.2" height="7.2" rx="2.2" fill="currentColor"/><rect x="13.3" y="3.5" width="7.2" height="7.2" rx="2.2" fill="currentColor"/><rect x="3.5" y="13.3" width="7.2" height="7.2" rx="2.2" fill="currentColor"/><rect x="13.3" y="13.3" width="7.2" height="7.2" rx="2.2" fill="currentColor"/></symbol>
    <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.9" fill="currentColor"/><circle cx="12" cy="12" r="1.9" fill="currentColor"/><circle cx="18.5" cy="12" r="1.9" fill="currentColor"/></symbol>
    <symbol id="i-codex" viewBox="0 0 24 24"><path d="M8 8l-4 4 4 4M16 8l4 4-4 4M13.5 6l-3 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5.5" y="10.5" width="13" height="10" rx="2.5" fill="currentColor"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5" fill="none" stroke="currentColor" stroke-width="2.2"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.8" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M3.4 12h17.2M12 3.2c2.4 2.4 3.6 5.4 3.6 8.8s-1.2 6.4-3.6 8.8c-2.4-2.4-3.6-5.4-3.6-8.8S9.6 5.6 12 3.2z" fill="none" stroke="currentColor" stroke-width="1.9"/></symbol>
    <symbol id="i-window" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="3.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 9h18" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M12 3.5a5.5 5.5 0 0 0-5.5 5.5v3.6L5 15.5v1h14v-1l-1.5-2.9V9A5.5 5.5 0 0 0 12 3.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9.8 19.2a2.3 2.3 0 0 0 4.4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-bell-on" viewBox="0 0 24 24"><path d="M12 3.5a5.5 5.5 0 0 0-5.5 5.5v3.6L5 15.5v1h14v-1l-1.5-2.9V9A5.5 5.5 0 0 0 12 3.5z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9.8 19.2a2.3 2.3 0 0 0 4.4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  </svg>

  <div id="app">
    <!-- sign in -->
    <section class="view" id="v-login">
      <div class="login">
        <img src="/icon-180.png" alt="" class="login-icon">
        <h1>Remote PC</h1>
        <p class="secondary">Scan the code on your PC, or enter your access key.</p>
        <form id="login-form" class="login-card glass">
          <input id="login-key" type="password" placeholder="Access key" autocomplete="current-password" autocapitalize="off" spellcheck="false">
          <button class="btn-primary" type="submit">Continue</button>
        </form>
        <p class="error" id="login-err"></p>
      </div>
    </section>

    <!-- agents -->
    <section class="view root" id="v-agents">
      <header class="topbar">
        <span></span>
        <div class="mini-title">Agents</div>
        <div class="gbar">
          <button class="gbtn glass" id="notify-btn" aria-label="Notifications"><svg><use href="#i-bell"/></svg></button>
          <button class="gbtn glass" id="new-agent" aria-label="New agent"><svg><use href="#i-compose"/></svg></button>
        </div>
      </header>
      <div class="scroll" id="agents-scroll">
        <div class="large"><h1>Agents</h1><p id="host-line"></p></div>
        <div id="agent-groups"></div>
      </div>
    </section>

    <!-- one conversation -->
    <section class="view" id="v-chat">
      <header class="topbar">
        <div class="gbar"><button class="gbtn glass" id="chat-back" aria-label="Back"><svg><use href="#i-back"/></svg></button></div>
        <div class="nav-title"><div id="chat-title"></div><small id="chat-sub"></small></div>
        <div class="gbar">
          <div class="gcapsule glass" id="chat-tools">
            <button id="btn-changes" class="hidden" aria-label="Changes"><svg><use href="#i-diff"/></svg><span></span></button>
            <button id="btn-preview" class="hidden" aria-label="Preview"><svg><use href="#i-play"/></svg></button>
          </div>
        </div>
      </header>
      <div class="scroll chat" id="chat-scroll"><div id="chat-items"></div></div>
      <form class="composer" id="composer">
        <div class="composer-status glass hidden" id="composer-status"></div>
        <div class="composer-row glass">
          <textarea id="prompt" rows="1" placeholder="Message" enterkeyhint="send"></textarea>
          <button class="send" type="submit" id="send" aria-label="Send" disabled><svg><use href="#i-up"/></svg></button>
          <button class="send stop hidden" type="button" id="stop" aria-label="Stop"><svg><use href="#i-stop"/></svg></button>
        </div>
      </form>
    </section>

    <!-- apps -->
    <section class="view root" id="v-apps">
      <header class="topbar">
        <span></span>
        <div class="mini-title">Apps</div>
        <div class="gbar"><button class="gbtn glass" id="apps-refresh" aria-label="Refresh"><svg><use href="#i-reload"/></svg></button></div>
      </header>
      <div class="scroll" id="apps-scroll">
        <div class="large"><h1>Apps</h1><p>Open one to use it from your phone.</p></div>
        <div id="app-list"></div>
      </div>
    </section>

    <!-- one app window -->
    <section class="view" id="v-win">
      <header class="topbar solid">
        <div class="gbar"><button class="gbtn glass" id="win-done" aria-label="Back to apps"><svg><use href="#i-back"/></svg></button></div>
        <div class="nav-title"><div id="win-title"></div><small id="win-sub"></small></div>
        <div class="gbar">
          <div class="gcapsule glass">
            <button id="win-kbd" aria-label="Keyboard"><svg><use href="#i-kbd"/></svg></button>
            <button id="win-more" aria-label="More"><svg><use href="#i-dots"/></svg></button>
          </div>
        </div>
      </header>
      <div id="win-stage"><canvas id="win-canvas"></canvas><div class="stage-msg" id="win-msg"><i class="spinner"></i><span>Opening…</span></div><button class="type-pill glass hidden" id="type-pill"><svg><use href="#i-kbd"/></svg>Tap to type</button></div>
      <div class="keyrow hidden" id="win-keys">
        <button data-key="enter">return</button><button data-key="backspace">delete</button><button data-key="esc">esc</button><button data-key="tab">tab</button>
        <button data-key="up">↑</button><button data-key="down">↓</button><button data-key="left">←</button><button data-key="right">→</button>
        <button data-key="ctrl+a">select all</button><button data-key="ctrl+c">copy</button><button data-key="ctrl+v">paste</button><button data-key="ctrl+z">undo</button>
      </div>
      <nav class="browserbar" id="browserbar">
        <button class="gbtn glass" id="win-back" aria-label="Back"><svg><use href="#i-back"/></svg></button>
        <button class="address glass" id="address"><svg class="lock"><use href="#i-lock"/></svg><span id="address-text">Chrome</span></button>
        <button class="gbtn glass" id="win-tabs" aria-label="Tabs"><span class="tabcount" id="tab-count">1</span></button>
      </nav>
      <textarea id="win-type" class="ghost-input" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
    </section>

    <nav class="tabbar glass" id="tabbar">
      <a href="#/" data-tab="agents"><svg><use href="#i-chat"/></svg><span>Agents</span><b class="badge hidden" id="badge"></b></a>
      <a href="#/apps" data-tab="apps"><svg><use href="#i-grid"/></svg><span>Apps</span></a>
    </nav>
  </div>

  <!-- new agent -->
  <div class="sheet hidden" id="sheet-new">
    <div class="sheet-dim" data-close></div>
    <form class="sheet-card" id="new-form">
      <div class="sheet-head">
        <button type="button" class="gbtn glass" data-close aria-label="Cancel"><svg><use href="#i-x"/></svg></button>
        <b>New Agent</b>
        <button type="submit" class="gbtn tint" id="new-start" aria-label="Start"><svg><use href="#i-up"/></svg></button>
      </div>
      <div class="sheet-body">
        <div class="segmented" id="new-tool">
          <button type="button" data-tool="claude" class="on">Claude Code</button>
          <button type="button" data-tool="codex">Codex</button>
        </div>
        <textarea id="new-prompt" class="field" rows="4" placeholder="What should it do?"></textarea>
        <p class="group-label">Project</p>
        <div class="group" id="new-projects"></div>
        <div class="group"><input id="new-cwd" class="row-input" placeholder="Other folder, e.g. C:\projects\app" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
        <div class="group">
          <label class="row switch-row"><span>Full access</span><input type="checkbox" id="new-full"><i class="switch"></i></label>
        </div>
        <p class="group-foot">With full access it can run any command without asking. Without it, it can still edit files in the project.</p>
        <p class="error" id="new-err"></p>
      </div>
    </form>
  </div>

  <!-- changes -->
  <div class="sheet hidden" id="sheet-changes">
    <div class="sheet-dim" data-close></div>
    <div class="sheet-card tall">
      <div class="sheet-head">
        <button type="button" class="gbtn glass" id="diff-back" aria-label="Close"><svg id="diff-back-icon"><use href="#i-x"/></svg></button>
        <b id="changes-title">Changes</b>
        <span></span>
      </div>
      <div class="sheet-body flush" id="changes-body"></div>
    </div>
  </div>

  <!-- browser tabs -->
  <div class="sheet hidden" id="sheet-tabs">
    <div class="sheet-dim" data-close></div>
    <div class="sheet-card">
      <div class="sheet-head">
        <button type="button" class="gbtn glass" data-close aria-label="Close"><svg><use href="#i-x"/></svg></button>
        <b id="tabs-title">Tabs</b>
        <button type="button" class="gbtn tint" id="tab-new" aria-label="New tab"><svg><use href="#i-plus"/></svg></button>
      </div>
      <div class="sheet-body"><div class="tabgrid" id="tab-list"></div></div>
    </div>
  </div>

  <!-- address editor -->
  <div class="sheet hidden" id="sheet-url">
    <div class="sheet-dim" data-close></div>
    <form class="url-edit" id="url-form">
      <div class="url-field glass"><svg><use href="#i-search"/></svg><input id="url-input" type="text" inputmode="url" enterkeyhint="go" placeholder="Search or enter website" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false"></div>
      <button type="button" class="link" data-close>Cancel</button>
    </form>
  </div>

  <!-- preview -->
  <div class="preview hidden" id="preview">
    <header class="topbar solid">
      <div class="gbar"><button class="gbtn glass" id="preview-done" aria-label="Close"><svg><use href="#i-x"/></svg></button></div>
      <div class="nav-title"><div id="preview-url"></div><small>Preview</small></div>
      <div class="gbar"><button class="gbtn glass" id="preview-reload" aria-label="Reload"><svg><use href="#i-reload"/></svg></button></div>
    </header>
    <iframe id="preview-frame" title="Preview"></iframe>
  </div>

  <!-- menu -->
  <div class="sheet hidden" id="sheet-actions">
    <div class="sheet-dim clear" data-close></div>
    <div class="menu glass" id="actions-list"></div>
  </div>

  <div class="toast glass" id="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
